apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
patches:
  - path: service-patch.yaml
configMapGenerator:
  - name: vitals-config
    behavior: merge
    literals:
      - FAIL_RATE=0 # game day: change to 0.3, commit, push, watch the SLO burn
# CI rewrites this block with `kustomize edit set image` on every merge to main.
images:
  - name: vitals-api
    newName: us-east1-docker.pkg.dev/YOUR_PROJECT_ID/vitals/vitals-api
    newTag: initial
