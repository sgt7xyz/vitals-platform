apiVersion: apps/v1
kind: Deployment
metadata:
  name: vitals-api
  labels:
    app.kubernetes.io/name: vitals-api
spec:
  # No `replicas:` on purpose. The HPA owns replica count; if Git also set it,
  # Argo CD and the HPA would fight over the field forever.
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: vitals-api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0 # never drop below desired capacity during a rollout
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vitals-api
    spec:
      serviceAccountName: vitals-api
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 20
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: vitals-api
      containers:
        - name: api
          image: vitals-api # rewritten by kustomize `images:` in the overlay
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: vitals-config
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              memory: 128Mi # memory limit yes; CPU limit no (avoids CFS throttling)
          startupProbe:
            httpGet: { path: /healthz, port: http }
            failureThreshold: 10
            periodSeconds: 2
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
