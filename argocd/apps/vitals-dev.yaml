apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: vitals-dev
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io # deleting the app deletes what it deployed
spec:
  project: default
  source:
    repoURL: https://github.com/YOUR_GH_USER/vitals-platform.git
    targetRevision: main
    path: k8s/overlays/dev
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: true    # resources removed from Git are removed from the cluster
      selfHeal: true # manual kubectl changes are reverted to match Git
    retry:
      limit: 5
      backoff: { duration: 10s, factor: 2, maxDuration: 3m }
